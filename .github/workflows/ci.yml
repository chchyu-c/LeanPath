name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静态检查 / 本地化生成 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 版本信息
        run: flutter --version
      - name: 依赖安装
        run: flutter pub get
      - name: 生成本地化代码
        run: flutter gen-l10n
      # 自动格式化而非门禁：示例工程未预先跑 dart format，
      # 用 --set-exit-if-changed 会让首次构建直接失败。
      - name: 统一格式化（CI 内自动执行，不阻断构建）
        run: dart format lib/main.dart lib/models lib/services lib/state lib/ui test
      - name: 静态分析
        run: flutter analyze --no-fatal-infos
      - name: 单元测试
        run: flutter test

  build_android:
    name: Android 冒烟构建（debug）
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成 / 补齐原生壳（保留定制配置）
        run: python3 scripts/prepare_native_shells.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: 构建 debug APK（无需签名）
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build_ios:
    name: iOS 冒烟构建（Debug，免签名）
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成 / 补齐原生壳（保留定制配置）
        run: python3 scripts/prepare_native_shells.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: 构建 debug iOS（no-codesign）
        run: flutter build ios --debug --no-codesign

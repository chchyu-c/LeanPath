name: cloud-build

# 零密钥云端编译：不需要 keystore / Apple 证书 / 本地 Flutter SDK，
# 推送代码后在 Actions 里手动 Run workflow 即可拿到可下载的构建产物。
# 需要正式签名发布包时用 release.yml（需配置 Secrets）。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        required: true
        default: both
        type: choice
        options: [android, ios, both]
      build_mode:
        description: 构建类型（release 使用 debug 签名，不可上架）
        required: true
        default: debug
        type: choice
        options: [debug, release]
      regenerate_shell:
        description: 强制重新生成原生壳工程
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'i18n/**'
      - 'pubspec.yaml'
      - 'l10n.yaml'
      - 'scripts/**'
      - '.github/workflows/cloud-build.yml'

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android 云端编译
    if: ${{ github.event_name == 'push' || inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 生成 / 补齐原生壳（保留定制配置）
        run: python3 scripts/prepare_native_shells.py ${{ inputs.regenerate_shell && '--force' || '' }}
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: 静态分析
        run: flutter analyze --no-fatal-infos
      - name: 单元测试
        run: flutter test
      - name: 编译 APK
        run: flutter build apk --${{ inputs.build_mode || 'debug' }} --split-per-abi
      - name: 编译 AAB（release）
        if: ${{ inputs.build_mode == 'release' }}
        run: flutter build appbundle --release
      - name: 归档 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: leanpath-android-${{ inputs.build_mode || 'debug' }}-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
      - name: 构建摘要
        run: |
          echo "### Android 云端编译完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 模式：${{ inputs.build_mode || 'debug' }}（零密钥，debug 签名）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 产物：Actions → Artifacts → leanpath-android-*" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/app/outputs/flutter-apk/ >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS 云端编译（免签名）
    if: ${{ github.event_name == 'push' || inputs.platform != 'android' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 生成 / 补齐原生壳（保留定制配置）
        run: python3 scripts/prepare_native_shells.py ${{ inputs.regenerate_shell && '--force' || '' }}
      - run: flutter pub get
      - run: flutter gen-l10n
      # 不单独跑 pod install：Flutter build ios 会自行处理 Podfile 与最低部署目标，
      # 显式执行反而会因 "Flutter pod requires a higher minimum deployment target" 失败。
      - name: 编译 iOS（免签名）
        run: flutter build ios --${{ inputs.build_mode || 'debug' }} --no-codesign
      - name: 打包未签名 IPA
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::未找到编译产物 .app"
            exit 1
          fi
          rm -rf Payload build/ios/output
          mkdir -p Payload build/ios/output
          cp -R "$APP" Payload/
          zip -qr build/ios/output/LeanPath-unsigned.ipa Payload
      - name: 归档 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: leanpath-ios-${{ inputs.build_mode || 'debug' }}-${{ github.run_number }}
          path: build/ios/output/*.ipa
          if-no-files-found: warn
          retention-days: 30
      - name: 构建摘要
        run: |
          echo "### iOS 云端编译完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 产物为**未签名 IPA**，仅用于构建验证 / 后续重签名，不能装真机。" >> "$GITHUB_STEP_SUMMARY"
          echo "- 正式签名 IPA 请用 release.yml（需证书与描述文件 Secrets）。" >> "$GITHUB_STEP_SUMMARY"
